<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio local de persistencia</title></head><body><h1>Datos desechables de prueba</h1><p>Este origen de prueba es distinto al de la aplicación principal.</p><button id="valid">Preparar hogar de prueba válido</button><button id="annual">Preparar facturas de dos años</button><button id="damaged">Preparar contenido dañado de prueba</button><button id="download">Descargar copia válida de prueba</button><p id="status" role="status"></p><a href="/#resumen">Abrir kwhTrack de prueba</a><script>
const data={settings:{name:'Hogar de pruebas',budget:100000,rate:1000,customRate:true},example:false,devices:[{id:'test-fan',name:'Ventilador de prueba',category:'Ventilador',watts:100,quantity:1,hours:5,days:30,factor:1}],readings:[],bills:[],draftPlan:[]};
document.querySelector('#valid').onclick=()=>{localStorage.setItem('kwhtrack.v1',JSON.stringify(data));document.querySelector('#status').textContent='Hogar válido preparado.';};
document.querySelector('#annual').onclick=()=>{const sample=structuredClone(data);sample.bills=[{id:'bill2024',start:'2024-01-01',end:'2024-02-01',kwh:30,amount:60000},{id:'bill2025',start:'2025-01-01',end:'2025-02-01',kwh:0,amount:0}];localStorage.setItem('kwhtrack.v1',JSON.stringify(sample));document.querySelector('#status').textContent='Facturas sintéticas de 2024 y 2025 preparadas.';};
document.querySelector('#damaged').onclick=()=>{localStorage.setItem('kwhtrack.v1','{registro-incompleto');document.querySelector('#status').textContent='Contenido dañado preparado solo en este origen de prueba.';};
document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({product:'kwhTrack',version:1,data})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kwhTrack-copia-laboratorio.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
